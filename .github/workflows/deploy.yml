name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # daily refresh so GitHub stats stay current
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build GitHub stats (token stays in CI)
        run: node .github/scripts/build-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBKEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mySite

      - uses: actions/deploy-pages@v4
        id: deployment
