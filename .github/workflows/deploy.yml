name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # daily refresh so GitHub stats stay current
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build GitHub stats (token stays in CI)
        run: node .github/scripts/build-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBKEY }}

      # Pages serves the gh-pages branch directly (branch-based mode);
      # publishing is just a force-push of mySite's contents.
      - name: Publish mySite to gh-pages branch
        run: |
          cd mySite
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
